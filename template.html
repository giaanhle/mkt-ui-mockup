<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>MKT mockup</title>
<style>
  /* ==== tokens.css (inlined — copy stays in sync with skill's tokens.css) ==== */
  :root {
    --mkt-page-bg: #eef1f5;
    --mkt-card-bg: #ffffff;
    --mkt-ink: #1a2233;
    --mkt-muted: #64748b;
    --mkt-border: #edeff2;
    --mkt-border-soft: #f5f6f8;

    --mkt-blue: #1075dc;
    --mkt-blue-tint: #e6f1fc;
    --mkt-green: #4cae72;
    --mkt-green-tint: #e9f7ef;
    --mkt-amber: #e0a030;
    --mkt-amber-tint: #fdf3e2;
    --mkt-coral: #e85c5c;
    --mkt-coral-tint: #fdeaea;
    --mkt-purple: #8650bd;
    --mkt-purple-tint: #f3ecfa;
    --mkt-gray-neutral: #a8adb5;
    --mkt-gray-neutral-tint: #eef0f2;

    --mkt-tooltip-bg: #141414;
    --mkt-tooltip-text: #ffffff;

    --mkt-spacing-2: 2px; --mkt-spacing-4: 4px; --mkt-spacing-6: 6px;
    --mkt-spacing-8: 8px; --mkt-spacing-12: 12px; --mkt-spacing-16: 16px;
    --mkt-spacing-20: 20px; --mkt-spacing-24: 24px; --mkt-spacing-32: 32px;
    --mkt-spacing-40: 40px; --mkt-spacing-48: 48px;

    --mkt-radius-4: 4px; --mkt-radius-8: 8px; --mkt-radius-12: 12px;
    --mkt-radius-16: 16px; --mkt-radius-24: 24px; --mkt-radius-full: 9999px;

    --mkt-shadow-1: 0 1px 2px rgba(20,30,60,0.06);
    --mkt-shadow-2: 0 4px 12px rgba(20,30,60,0.08);
    --mkt-shadow-3: 0 10px 28px rgba(20,30,60,0.10);
    --mkt-shadow-4: 0 20px 50px rgba(20,30,60,0.12);

    --mkt-text-10: 10px; --mkt-text-11: 11px; --mkt-text-12: 12px;
    --mkt-text-13: 13px; --mkt-text-15: 15px; --mkt-text-17: 17px;
    --mkt-text-20: 20px; --mkt-text-23: 23px; --mkt-text-26: 26px;
  }

  /* ==== patterns.css (inlined — copy stays in sync with skill's patterns.css) ==== */
  .mkt-card { background: var(--mkt-card-bg); border-radius: var(--mkt-radius-16); box-shadow: var(--mkt-shadow-4); }
  .mkt-card-soft { background: var(--mkt-card-bg); border-radius: var(--mkt-radius-12); box-shadow: var(--mkt-shadow-2); }

  .mkt-connector { position: absolute; width: 24px; height: 2px; background: var(--mkt-blue); }
  .mkt-connector::after { content: ""; position: absolute; right: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--mkt-blue); }
  .mkt-connector.mkt-connector-vertical { width: 2px; height: 24px; }
  .mkt-connector.mkt-connector-vertical::after { right: -3px; top: -4px; }

  .mkt-highlight-blue { border: 2px solid var(--mkt-blue); border-radius: var(--mkt-radius-16); }
  .mkt-highlight-coral { border: 2px solid var(--mkt-coral); border-radius: var(--mkt-radius-16); }

  .mkt-cursor { position: absolute; width: 18px; height: 18px; pointer-events: none; }
  .mkt-cursor svg { width: 100%; height: 100%; }

  .mkt-badge-annotation { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: var(--mkt-coral); color: #fff; font-size: var(--mkt-text-11); font-weight: 600; display: flex; align-items: center; justify-content: center; box-shadow: var(--mkt-shadow-2); }

  .mkt-tooltip { position: relative; display: inline-block; background: var(--mkt-tooltip-bg); color: var(--mkt-tooltip-text); border-radius: var(--mkt-radius-8); padding: var(--mkt-spacing-8) var(--mkt-spacing-12); font-size: var(--mkt-text-12); line-height: 1.5; box-shadow: var(--mkt-shadow-3); }
  .mkt-tooltip::before { content: ""; position: absolute; left: -6px; top: 14px; width: 12px; height: 12px; background: var(--mkt-tooltip-bg); transform: rotate(45deg); }
  .mkt-tooltip.mkt-tooltip-top::before { left: 14px; top: -6px; }

  .mkt-pill { display: inline-block; font-size: var(--mkt-text-11); font-weight: 600; padding: 2px 10px; border-radius: var(--mkt-radius-full); }
  .mkt-pill-blue { background: var(--mkt-blue-tint); color: var(--mkt-blue); }
  .mkt-pill-green { background: var(--mkt-green-tint); color: var(--mkt-green); }
  .mkt-pill-amber { background: var(--mkt-amber-tint); color: var(--mkt-amber); }
  .mkt-pill-coral { background: var(--mkt-coral-tint); color: var(--mkt-coral); }
  .mkt-pill-purple { background: var(--mkt-purple-tint); color: var(--mkt-purple); }
  .mkt-pill-neutral { background: var(--mkt-gray-neutral-tint); color: var(--mkt-gray-neutral); }
  .mkt-pill-gray { background: var(--mkt-border-soft); color: var(--mkt-muted); }

  .mkt-input-verified { border: 1px solid var(--mkt-green); background: var(--mkt-green-tint); }
  .mkt-input-linked { border: 1px solid var(--mkt-blue); background: var(--mkt-blue-tint); }
  .mkt-input-flagged { border: 1px solid var(--mkt-coral); background: var(--mkt-coral-tint); }

  .mkt-table { width: 100%; border-collapse: collapse; }
  .mkt-table th { text-align: left; font-size: var(--mkt-text-11); font-weight: 500; color: var(--mkt-muted); padding: var(--mkt-spacing-12) var(--mkt-spacing-16); border-bottom: 1px solid var(--mkt-border); }
  .mkt-table.mkt-table-tinted th { background: var(--mkt-border-soft); }
  .mkt-table td { font-size: var(--mkt-text-13); color: var(--mkt-ink); padding: var(--mkt-spacing-16); border-bottom: 1px solid var(--mkt-border-soft); vertical-align: middle; }
  .mkt-table tr:last-child td { border-bottom: none; }
  .mkt-table td.mkt-col-divider, .mkt-table th.mkt-col-divider { border-left: 1px solid var(--mkt-border); }
  .mkt-sort-caret { display: inline-block; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 5px solid var(--mkt-muted); margin-left: 4px; }
  .mkt-sort-caret.mkt-sort-active { border-bottom-color: var(--mkt-blue); }

  .mkt-eyebrow { display: inline-block; font-size: var(--mkt-text-11); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--mkt-muted); }
  .mkt-eyebrow-green { color: var(--mkt-green); }
  .mkt-eyebrow-blue { color: var(--mkt-blue); }
  .mkt-eyebrow-amber { color: var(--mkt-amber); }
  .mkt-eyebrow-coral { color: var(--mkt-coral); }

  .mkt-pill-solid { display: inline-block; font-size: var(--mkt-text-11); font-weight: 600; padding: 2px 10px; border-radius: var(--mkt-radius-full); color: #fff; }
  .mkt-pill-solid-blue { background: var(--mkt-blue); }
  .mkt-pill-solid-green { background: var(--mkt-green); }
  .mkt-pill-solid-amber { background: var(--mkt-amber); }
  .mkt-pill-solid-coral { background: var(--mkt-coral); }
  .mkt-pill-solid-purple { background: var(--mkt-purple); }
  .mkt-pill-solid-neutral { background: var(--mkt-gray-neutral); }

  .mkt-segment-strip { display: inline-flex; }
  .mkt-segment { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 22px; padding: 0 8px; font-size: var(--mkt-text-12); font-weight: 600; color: #fff; }
  .mkt-segment-blue { background: var(--mkt-blue); }
  .mkt-segment-green { background: var(--mkt-green); }
  .mkt-segment-amber { background: var(--mkt-amber); }
  .mkt-segment-coral { background: var(--mkt-coral); }
  .mkt-segment-purple { background: var(--mkt-purple); }
  .mkt-segment-neutral { background: var(--mkt-gray-neutral); }
  .mkt-segment-strip .mkt-segment:first-child { border-radius: var(--mkt-radius-4) 0 0 var(--mkt-radius-4); }
  .mkt-segment-strip .mkt-segment:last-child { border-radius: 0 var(--mkt-radius-4) var(--mkt-radius-4) 0; }

  .mkt-checkbox { display: inline-block; width: 16px; height: 16px; border-radius: var(--mkt-radius-4); border: 1.5px solid var(--mkt-border); background: var(--mkt-card-bg); vertical-align: middle; }

  .mkt-switch { position: relative; display: inline-block; width: 34px; height: 20px; border-radius: var(--mkt-radius-full); background: var(--mkt-border); vertical-align: middle; }
  .mkt-switch-on { background: var(--mkt-blue); }
  .mkt-switch-knob { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: var(--mkt-shadow-1); }
  .mkt-switch-on .mkt-switch-knob { left: 16px; }

  .mkt-button { display: inline-block; font-size: var(--mkt-text-13); font-weight: 600; padding: 8px 16px; border-radius: var(--mkt-radius-8); border: 1px solid var(--mkt-border); background: var(--mkt-card-bg); color: var(--mkt-ink); }
  .mkt-button-primary { background: var(--mkt-blue); border-color: var(--mkt-blue); color: #fff; }

  .mkt-avatar { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; font-size: var(--mkt-text-11); font-weight: 600; color: #fff; flex-shrink: 0; }
  .mkt-avatar-1 { background: var(--mkt-blue); }
  .mkt-avatar-2 { background: var(--mkt-green); }
  .mkt-avatar-3 { background: var(--mkt-amber); }
  .mkt-avatar-4 { background: var(--mkt-coral); }
  .mkt-avatar-5 { background: var(--mkt-purple); }
  .mkt-avatar-6 { background: var(--mkt-gray-neutral); }

  /* ==== canvas ==== */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  /* Output is a transparent-background PNG sized to the content, not a
     fixed social-post canvas — these mockups are raw material composited
     into other assets later. body has no width/height/background of its
     own; it just wraps whatever the mockup's own card(s) size themselves
     to. Render with a generously large browser window and a transparent
     --default-background-color, then auto-crop to the alpha bounding box
     (see "Rendering & output" in SKILL.md / trim.py). */
  html, body {
    background: transparent;
    display: inline-flex;
    align-items: flex-start;
    justify-content: flex-start;
  }
  body {
    font-family: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    color: var(--mkt-ink);
  }

  /* ---- CONTENT STARTS HERE — replace .content with the actual mockup ----
     .content sizes itself to whatever's inside it (no fixed width/height).
     The mockup's card(s) (.mkt-card etc.) stay opaque white as normal —
     only the page/canvas around them is transparent. */
  .content {
    display: inline-flex;
    color: var(--mkt-muted);
    font-size: var(--mkt-text-15);
  }
</style>
</head>
<body>
  <div class="content">
    Replace this &lt;div class="content"&gt; with the mockup, using .mkt-card /
    .mkt-pill-* / .mkt-avatar-* / .mkt-tooltip / .mkt-connector etc. from
    patterns.css above. Run verify.py on the finished file before rendering.
  </div>
</body>
</html>
